name: Prueba self-hosted runner

on:
  push:

jobs:
  comparar-tokens:
    runs-on: self-hosted

    env:
      DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden correctamente."
          }
          else {
            Write-Error "Los tokens NO coinciden."
            exit 1
          }