name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrementar versión
        run: |
          VERSION=$(grep -oE 'AppVersion-[0-9]+' README.md | head -1 | cut -d'-' -f2)
          NEXT_VERSION=$((VERSION + 1))
          DATE=$(date "+%d/%m/%Y %H:%M")
          sed -i "s/AppVersion-$VERSION/AppVersion-$NEXT_VERSION/" README.md
          echo "Fecha actualización: $DATE" >> README.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizada versión de la aplicación" || echo "No hay cambios"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  validate-prod:
    runs-on: self-hosted
    needs: bump-version

    steps:
      - name: Validar PROD_TOKEN
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        shell: powershell
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "PROD_TOKEN coincide con LOCAL_PROD_TOKEN"
          }
          else {
            Write-Host "PROD_TOKEN NO coincide con LOCAL_PROD_TOKEN"
            exit 1
          }
