name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar README
        run: |
          FEATURE="Añadida feature: ${{ github.head_ref || github.ref_name }}"
          if ! grep -Fxq "$FEATURE" README.md; then
            echo "$FEATURE" >> README.md
          fi

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizada README desde CI" || echo "No hay cambios"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  validate-dev:
    runs-on: self-hosted
    needs: update-readme

    steps:
      - name: Validar DEV_TOKEN
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
          }
          else {
            Write-Host "DEV_TOKEN NO coincide con LOCAL_DEV_TOKEN"
            exit 1
          }
